name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openswoole, mbstring, xml, zip
          coverage: none

      - name: Validate composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint PHP files
        run: |
          ! find . -path ./vendor -prune -o -name '*.php' -exec php -l {} \; 2>&1 | grep -qiE 'parse error|fatal error|errors parsing'

      - name: Run Pest
        run: composer test
